version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: loomcrete-postgres
    environment:
      POSTGRES_USER: loomcrete
      POSTGRES_PASSWORD: loomcrete-dev
      POSTGRES_INITDB_ARGS: "-c shared_buffers=128MB"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomcrete"]
      interval: 10s
      timeout: 5s
      retries: 5
    resources:
      limits:
        memory: 1G
        cpus: '1'
    networks:
      - loomcrete-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: loomcrete-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    ports:
      - "2181:2181"
    resources:
      limits:
        memory: 256M
    networks:
      - loomcrete-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: loomcrete-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_MS: 3600000
    resources:
      limits:
        memory: 512M
        cpus: '0.5'
    networks:
      - loomcrete-network

volumes:
  postgres-data:
    driver: local

networks:
  loomcrete-network:
    driver: bridge
