quarkus:
  app:
    name: tenant-service
    version: 1.0.0-SNAPSHOT
  server:
    port: 8081
  datasource:
    db-kind: postgresql
    jdbc:
      url: jdbc:postgresql://localhost:5432/loomcrete_tenant
      driver: org.postgresql.Driver
    username: loomcrete
    password: loomcrete-dev
  devservices:
    enabled: true
  hibernate-orm:
    database:
      generation: drop-and-create
    show-sql: false
  http:
    port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    dev.noe.loomcrete: DEBUG
